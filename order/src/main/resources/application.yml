spring:
  application:
    name: order-service

  # Database Configuration (H2 for development)
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost        # RabbitMQ 伺服器位置
    port: 5672             # RabbitMQ 預設端口
    username: guest        # 預設帳號
    password: guest        # 預設密碼

# Server Configuration
server:
  port: 8081

# Logging Configuration
logging:
  level:
    com.example.order: DEBUG
